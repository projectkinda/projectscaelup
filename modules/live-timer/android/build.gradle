plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.livetimer'
version = '1.0.0'

android {
  buildFeatures { buildConfig true }
  namespace 'expo.modules.livetimer'
  buildTypes {
    debug { buildConfigField 'boolean', 'TEST_TOOLS_ENABLED', 'true' }
    release { buildConfigField 'boolean', 'TEST_TOOLS_ENABLED', 'false' }
  }
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
